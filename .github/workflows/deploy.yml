name: Deploy to Local Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Sync Files to Apache Web Directory
        run: |
          echo "Deploying project files to /var/www/html/jescanan..."
          # Gamitin ang sudo kung kinakailangan o siguraduhing may access ang user runner
          sudo cp -r ./* /var/www/html/jescanan/
          
      - name: Verify Deployment Status
        run: |
          echo "Deployment completed successfully!"
          ls -la /var/www/html/jescanan/
          